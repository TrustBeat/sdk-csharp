# Publishes the TrustBeat NuGet package on a version tag.
#
# This workflow lives at the root of TrustBeat/sdk-csharp (mirrored from
# eu-security-app sdk/csharp). It does NOT run in the monorepo.
#
# Auth: nuget.org Trusted Publishing (OIDC). No stored secret — NuGet/login
# exchanges a short-lived GitHub OIDC token for a 1-hour NuGet API key. Requires
# a trusted publishing policy on nuget.org: owner radim.dejmek, repo
# TrustBeat/sdk-csharp, workflow file publish.yml.
name: Publish to NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # request the GitHub OIDC token for NuGet trusted publishing
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee  # v4.0.1
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -oP '(?<=<Version>)[^<]+' TrustBeat/TrustBeat.csproj | head -1)
          echo "tag=$tag pkg=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != csproj Version $pkg"; exit 1; }

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack TrustBeat/TrustBeat.csproj -c Release -o artifacts

      # Exchange the GitHub OIDC token for a short-lived (1h) NuGet API key.
      # Done right before push so the key doesn't expire mid-run.
      - name: NuGet login (OIDC → temp API key)
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841  # v1.2.0
        with:
          user: radim.dejmek   # nuget.org username (profile name), NOT the email

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      # Dogfood: qualified timestamp for the exact .nupkg just published.
      # Evidence step only — must never turn a completed publish red.
      - name: Anchor release artifacts (TrustBeat)
        continue-on-error: true
        uses: TrustBeat/anchor-action@a5eb4451717f36d7bd1b6142a473003031f27512  # v1.0.0
        with:
          api-key: ${{ secrets.TRUSTBEAT_API_KEY }}
          files: artifacts/*.nupkg
          description: "TrustBeat NuGet ${{ github.ref_name }}"
