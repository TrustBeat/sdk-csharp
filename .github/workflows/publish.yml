# Publishes the TrustBeat NuGet package on a version tag.
#
# This workflow lives at the root of TrustBeat/sdk-csharp (mirrored from
# eu-security-app sdk/csharp). It does NOT run in the monorepo.
#
# Auth: NUGET_API_KEY secret (nuget.org API key scoped to push TrustBeat).
name: Publish to NuGet

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-dotnet@6bd8b7f7774af54e05809fcc5431931b3eb1ddee  # v4.0.1
        with:
          dotnet-version: '8.0.x'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(grep -oP '(?<=<Version>)[^<]+' TrustBeat/TrustBeat.csproj | head -1)
          echo "tag=$tag pkg=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != csproj Version $pkg"; exit 1; }

      - name: Test
        run: dotnet test -c Release

      - name: Pack
        run: dotnet pack TrustBeat/TrustBeat.csproj -c Release -o artifacts

      - name: Publish to NuGet
        run: >
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ secrets.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
